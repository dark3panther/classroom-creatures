<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff">
<script>
// Procedural watercolour washes for Classroom Creatures field-guide plates.
// Layered glazes of recursively deformed polygons (after Tyler Hobbs' watercolour method),
// pigment pooled at each layer's edge, then granulation and paper tooth.
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=(h+0x6d2b79f5)|0;let t=Math.imul(h^(h>>>15),1|h);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function paint(seed, pale, pooled, edge, W=600, H=450){
  const r=rng(seed);
  const gauss=()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const deform=(poly,depth,scale)=>{let p=poly;for(let d=0;d<depth;d++){const out=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];out.push(a);const len=Math.hypot(b.x-a.x,b.y-a.y);const v=(a.v+b.v)/2;out.push({x:(a.x+b.x)/2+gauss()*len*scale*v,y:(a.y+b.y)/2+gauss()*len*scale*v,v:v*(0.8+r()*0.4)});}p=out;}return p;};
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const cx=W/2+(r()-.5)*W*.04, cy=H*.53+(r()-.5)*H*.04, rx=W*.37, ry=H*.34;
  const base=[];const n=11;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+r()*.2;const k=.88+r()*.2;base.push({x:cx+Math.cos(a)*rx*k,y:cy+Math.sin(a)*ry*k,v:.5+r()*1.4});}
  const shape=deform(base,3,.2);
  const layer=(poly,fill,alpha,strokeA)=>{
    const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
    o.beginPath();poly.forEach((p,i)=>i?o.lineTo(p.x,p.y):o.moveTo(p.x,p.y));o.closePath();
    o.fillStyle=fill;o.globalAlpha=alpha;o.fill();
    if(strokeA){o.globalAlpha=strokeA;o.lineWidth=1.6+r()*1.6;o.strokeStyle=edge;o.stroke();}
    // blotchy texture: knock out random soft holes so glazes overlap unevenly
    o.globalCompositeOperation='destination-out';o.globalAlpha=1;
    for(let k=0;k<26;k++){const hx=r()*W,hy=r()*H,hr=8+r()*46;const g=o.createRadialGradient(hx,hy,0,hx,hy,hr);g.addColorStop(0,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');o.fillStyle=g;o.fillRect(hx-hr,hy-hr,hr*2,hr*2);}
    x.drawImage(off,0,0);
  };
  // under-glaze in the pale tint, wider and softer
  const paleShape=deform(base.map(p=>({x:cx+(p.x-cx)*1.07,y:cy+(p.y-cy)*1.06,v:p.v})),3,.22);
  for(let i=0;i<34;i++)layer(deform(paleShape,3,.1),pale,.05,0);
  // pigment glazes in the pooled tint, edges darkened where each glaze dries
  for(let i=0;i<46;i++)layer(deform(shape,3,.08),pooled,.036,.055);
  // a few blooms (back-runs): lighter cauliflower patches inside the wash
  x.globalCompositeOperation='destination-out';
  for(let b=0;b<2+Math.floor(r()*2);b++){const bx=cx+(r()-.5)*rx*1.1,by=cy+(r()-.5)*ry*.9,br=30+r()*50;const bl=[];for(let i=0;i<9;i++){const a=i/9*Math.PI*2;bl.push({x:bx+Math.cos(a)*br,y:by+Math.sin(a)*br*.8,v:1});}
    const bp=deform(bl,3,.25);x.beginPath();bp.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.globalAlpha=.16;x.fill();}
  x.globalCompositeOperation='source-over';x.globalAlpha=1;
  // granulation + paper tooth: pigment settles darker in the tooth's valleys
  const img=x.getImageData(0,0,W,H),d=img.data;const [er,eg,eb]=hexRgb(edge);
  const vr=rng(seed+'tooth');const N=128;const grid=new Float32Array(N*N).map(()=>vr());
  const vn=(px,py)=>{const gx=px/6,gy=py/6;const x0=Math.floor(gx),y0=Math.floor(gy),fx=gx-x0,fy=gy-y0;const g=(i,j)=>grid[((j%N+N)%N)*N+((i%N+N)%N)];const s=t=>t*t*(3-2*t);const a=g(x0,y0)+(g(x0+1,y0)-g(x0,y0))*s(fx),b=g(x0,y0+1)+(g(x0+1,y0+1)-g(x0,y0+1))*s(fx);return a+(b-a)*s(fy);};
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){const o=(py*W+px)*4;const a=d[o+3];if(!a)continue;
    const tooth=vn(px,py)*.6+vn(px*3.1,py*3.1)*.4;const speck=vr()<.012?vr()*.55:0;
    const k=Math.max(0,tooth-.55)*.9+speck;
    d[o]=d[o]+(er-d[o])*k*.5;d[o+1]=d[o+1]+(eg-d[o+1])*k*.5;d[o+2]=d[o+2]+(eb-d[o+2])*k*.5;d[o+3]=Math.min(255,a*(1+k*.35));}
  x.putImageData(img,0,0);
  return c.toDataURL('image/webp',.8);
}
window.paint=paint;
</script>
<script>
// Tileable bookcloth weave overlay: plain weave, 3px threads, per-thread tone and slubs. Alpha-only light/dark.
function cloth(T=240, t=3){
  const c=document.createElement('canvas');c.width=T;c.height=T;const x=c.getContext('2d');const img=x.createImageData(T,T),d=img.data;
  const r=rng('bookcloth');const n=T/t;const warp=Array.from({length:n},()=>(r()-.5)*.5),weft=Array.from({length:n},()=>(r()-.5)*.5);
  const slubW=Array.from({length:n},()=>Array.from({length:T},()=>r())),slubH=Array.from({length:n},()=>Array.from({length:T},()=>r()));
  for(let py=0;py<T;py++)for(let px=0;px<T;px++){const i=Math.floor(px/t),j=Math.floor(py/t);const over=(i+j)%2===0;
    const u=over?(px%t+.5)/t:(py%t+.5)/t;const ridge=Math.sin(u*Math.PI); // round thread profile
    const tone=over?warp[i]+(slubW[i][py]>.985?.35:0):weft[j]+(slubH[j][px]>.985?.35:0);
    let v=(ridge-.62)*.9+tone*.6; // -ve = shadow, +ve = highlight
    const o=(py*T+px)*4;if(v>=0){d[o]=d[o+1]=d[o+2]=255;d[o+3]=Math.min(255,v*70);}else{d[o]=d[o+1]=d[o+2]=0;d[o+3]=Math.min(255,-v*120);}}
  x.putImageData(img,0,0);return c.toDataURL('image/png');
}
window.cloth=cloth;
</script>

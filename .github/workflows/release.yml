name: Release

# Publish the Mac app on the repository's Releases page, either by pushing a tag like v1.3.0
# or from the Actions tab: Release → Run workflow → enter the version (the tag is created for you).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example v1.3.0 (tags the commit this runs on)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run app:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" release/*.dmg release/*.zip --target "$GITHUB_SHA" \
            --title "Classroom Creatures ${TAG#v}" \
            --notes "Download the .dmg, open it and drag Classroom Creatures into Applications. First launch: right-click the app → Open (it is not notarised by Apple)."

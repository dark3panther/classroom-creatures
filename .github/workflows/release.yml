name: Release

# Push a tag like v1.2.0 to publish the Mac app on the repository's Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run app:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip \
            --title "Classroom Creatures ${GITHUB_REF_NAME#v}" \
            --notes "Download the .dmg, open it and drag Classroom Creatures into Applications. First launch: right-click the app → Open (it is not notarised by Apple)."
